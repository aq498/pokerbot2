name: Run OpenPoker Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Backup trigger every 2 hours

permissions:
  actions: write
  contents: read

concurrency:
  group: openpoker-bot
  cancel-in-progress: false

jobs:
  play-poker:
    runs-on: ubuntu-latest
    timeout-minutes: 125

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (2-Hour Cycle)
        id: run-bot
        env:
          OPEN_POKER_API_KEY: ${{ secrets.OPEN_POKER_API_KEY }}
          CPU_WORKERS: "2"
          TARGET_ACTION_TIME: "4.75"
          MC_MAX_ITERS: "700000"
          BUY_IN_AMOUNT: "1500"
          PROFIT_LOCK_STACK: "5000"
        # We record the start time to ensure it doesn't loop instantly on quick crashes
        run: |
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
          
          timeout 115m python -u bot.py || true
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Safely Trigger Next 2-Hour Run
        # ONLY triggers if the bot ran for at least 5 minutes (prevents rapid-fire loops)
        if: always() && steps.run-bot.outputs.duration > 300
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Run OpenPoker Bot 24/7"

name: Run OpenPoker Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Backup trigger every 2 hours in case a run fails

permissions:
  actions: write # Required for `gh workflow run` to trigger the next job
  contents: read

concurrency:
  group: openpoker-bot
  cancel-in-progress: false # Prevents the scheduled cron from killing an active game

jobs:
  play-poker:
    runs-on: ubuntu-latest
    timeout-minutes: 125 # Hard ceiling at 2h 05m

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up startup by caching wheels between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (2-Hour Cycle)
        env:
          OPEN_POKER_API_KEY: ${{ secrets.OPEN_POKER_API_KEY }}
          CPU_WORKERS: "2"
          TARGET_ACTION_TIME: "4.75"
          MC_MAX_ITERS: "700000"
          BUY_IN_AMOUNT: "1500"
          PROFIT_LOCK_STACK: "5000"
        # timeout 115m stops cleanly so the next step can trigger the loop
        run: timeout 115m python -u bot.py || true

      - name: Immediately Trigger Next 2-Hour Run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Run OpenPoker Bot 24/7"
